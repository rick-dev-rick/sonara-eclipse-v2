name: Deploy SONARA Eclipse to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Retrieve original album artwork
        run: node scripts/sync-cover-art.mjs
      - name: Fetch artist photographs
        run: node scripts/sync-artist-photos.mjs
      - name: Retrieve album tracklists
        run: node scripts/sync-tracklists.mjs
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear stale Pages deployment lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub Pages retained a stuck deployment from a previous failed run.
          status=$(curl --silent --show-error --output /tmp/pages-cancel.json --write-out '%{http_code}' --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/e2969bd82fd7920fb24039ea3e8c121bc236a6f9/cancel")
          echo "Stale Pages deployment cancel response: ${status}"
          if [ "${status}" != "204" ] && [ "${status}" != "404" ]; then
            cat /tmp/pages-cancel.json
            exit 1
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
