name: Deploy SONARA Eclipse to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Retrieve original album artwork
        run: node scripts/sync-cover-art.mjs
      - name: Fetch artist photographs
        run: node scripts/sync-artist-photos.mjs
      - name: Retrieve album tracklists
        run: node scripts/sync-tracklists.mjs
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Diagnose and release stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          stale="e2969bd82fd7920fb24039ea3e8c121bc236a6f9"
          api="https://api.github.com/repos/${repo}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "Inspecting stuck Pages deployment:"
          curl -fsSL "${headers[@]}" "${api}/pages/deployments/${stale}" || true
          echo
          echo "Inspecting matching GitHub deployment records:"
          curl -fsSL "${headers[@]}" "${api}/deployments?sha=${stale}&per_page=100" -o /tmp/stale-github-deployments.json
          jq -c '.[] | {id,sha,environment,statuses_url}' /tmp/stale-github-deployments.json
          while IFS= read -r id; do
            [ -n "${id}" ] || continue
            echo "Marking stuck deployment ${id} inactive:"
            curl -sS "${headers[@]}" -X POST "${api}/deployments/${id}/statuses" -d '{"state":"inactive","description":"Clear orphaned GitHub Pages deployment lock"}' | jq -c '{id,state,description,message}'
            echo "Deleting inactive orphaned deployment ${id}:"
            curl -sS "${headers[@]}" -o /tmp/delete-deployment.json -w 'HTTP %{http_code}\n' -X DELETE "${api}/deployments/${id}"
          done < <(jq -r '.[] | select(.environment=="github-pages") | .id' /tmp/stale-github-deployments.json)
          echo "Requesting cancellation of stuck Pages deployment:"
          curl -sS "${headers[@]}" -o /tmp/pages-cancel.json -w 'HTTP %{http_code}\n' -X POST "${api}/pages/deployments/${stale}/cancel"
          echo "Checking cancellation status:"
          for n in 1 2 3 4 5 6 7 8; do
            status=$(curl -sS "${headers[@]}" "${api}/pages/deployments/${stale}" | jq -r '.status // .message // "unknown"')
            echo "Attempt ${n}: ${status}"
            case "${status}" in
              in_progress|pending|queued|unknown) sleep 5 ;;
              *) break ;;
            esac
          done
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
