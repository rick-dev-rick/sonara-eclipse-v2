 <g fill="#1a1917" font-family="Georgia,serif" font-style="italic">
 <text x="90" y="159" font-size="54">a world of emotion</text>
 <text x="110" y="240" font-size="31">THE MUSIC</text>
 <text x="113" y="298" font-size="29">LIVES ON.</text>
 <text x="145" y="420" font-size="63">17.</text>
 </g>
</g>
<path d="M0 1452 L72 1438 119 1459 169 1443 212 1472 266 1442 324 1460 370 1449 434 1466 508 1450 555 1472 640 1447 722 1465 807 1444 893 1463 951 1443 1007 1464 1100 1441 1160 1470 1231 1440 1280 1459 L1280 1680 H0Z" fill="#0a0909" opacity=".87"/>
