<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1680" viewBox="0 0 1280 1680">
<defs>
 <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="3" seed="14" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
 <linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset=".38" stop-color="#26231f"/><stop offset=".7" stop-color="#171513"/><stop offset="1" stop-color="#080808"/></linearGradient>
 <linearGradient id="paper" x1="0" x2="1" y2="1"><stop stop-color="#9f9688"/><stop offset=".52" stop-color="#635d54"/><stop offset="1" stop-color="#b6aa96"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
 <pattern id="lines" width="40" height="35" patternUnits="userSpaceOnUse"><path d="M0 34 H40" stroke="#d9ccba" stroke-opacity=".25" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="1680" fill="url(#bg)"/>
<ellipse cx="1050" cy="210" rx="420" ry="300" fill="#867764" opacity=".27" filter="url(#blur)"/>
<ellipse cx="200" cy="1320" rx="430" ry="420" fill="#766b5c" opacity=".24" filter="url(#blur)"/>
