<g transform="translate(690 40) rotate(12 270 350)" opacity=".5">
 <path d="M20 4 L490 0 523 48 505 146 518 310 492 390 518 582 477 618 427 601 385 625 329 604 282 622 237 604 184 627 129 606 74 620 11 582 33 490 9 390 32 290 10 180 Z" fill="url(#paper)"/>
 <rect x="60" y="65" width="395" height="480" fill="url(#lines)"/>
 <path d="M112 61 V545" stroke="#3f3931" opacity=".55" stroke-width="2"/>
 <g fill="#23211e" opacity=".85" font-family="Georgia,serif" font-style="italic">
  <text x="145" y="153" font-size="49">17</text>
  <text x="136" y="230" font-size="26">the music lives on</text>
  <text x="142" y="284" font-size="23">forever in our memories</text>
  <text x="138" y="344" font-size="33">Jahseh.</text>
  <text x="145" y="405" font-size="22">remember the feeling</text>
 </g>
 <path d="M195 468 Q250 432 273 477 Q310 425 365 458 L286 534 Z" fill="none" stroke="#433d35" stroke-width="5" opacity=".6" stroke-linecap="round"/>
</g>
<g transform="translate(-130 780) rotate(-12 360 300)" opacity=".37">
 <path d="M16 25 L668 0 650 170 668 321 643 494 662 620 612 601 557 630 492 606 437 629 368 611 300 629 242 610 192 625 139 607 74 619 5 596 23 510 3 438 25 334 4 230 Z" fill="url(#paper)"/>
